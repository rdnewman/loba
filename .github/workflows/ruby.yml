name: Ruby

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0']

    steps:
    - uses: actions/checkout@v3
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Test using RSpec
      run: |
        bundle exec rspec
    - name: Lint using Rubocop
      run: |
        bundle exec rubocop

  performance:
    runs-on: ubuntu-latest
    # Timing checks depend on the runner's speed and load, so a failure here
    # is reported without failing the workflow.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v3
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - name: Timing checks using RSpec
      run: |
        bundle exec rspec --tag performance
